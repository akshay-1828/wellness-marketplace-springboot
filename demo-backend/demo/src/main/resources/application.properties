spring.application.name=demo

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000


# ===============================
# NPI REGISTRY API
# ===============================
npi.api.base-url=https://npiregistry.cms.hhs.gov/api/


# ===============================
# WHO API
# ===============================
who.api.base-url=


# ===============================
# OpenFDA API
# ===============================
openfda.api.base-url=https://api.fda.gov/drug/label.json?search=purpose:


# ===============================
# GROQ AI
# ===============================
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.key=${GROQ_API_KEY}
groq.model=llama-3.3-70b-versatile


# ===============================
# EMAIL / SESSION REMINDER
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# ===============================
# SESSION REMINDER
# ===============================
app.reminder.hours-before=24
app.reminder.cron=0 0 * * * *


# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=always
server.port=${PORT:8080}